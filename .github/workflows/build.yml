name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: notedit-windows-x64
            bin: notedit.exe
          - os: ubuntu-latest
            name: notedit-linux-x64
            bin: notedit
          - os: macos-latest
            name: notedit-macos-arm64
            bin: notedit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/${{ matrix.bin }}, README.md, LICENSE, ui/fonts/LICENSE-DejaVu.txt, ui/fonts/LICENSE-JetBrainsMono-OFL.txt $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          d=${{ matrix.name }}
          mkdir $d
          cp target/release/${{ matrix.bin }} README.md LICENSE ui/fonts/LICENSE-DejaVu.txt ui/fonts/LICENSE-JetBrainsMono-OFL.txt $d/
          chmod +x $d/${{ matrix.bin }}
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          name: NotEdit ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
