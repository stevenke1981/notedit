name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: notedit-windows-x64
            bin: notedit.exe
          - os: ubuntu-latest
            name: notedit-linux-x64
            bin: notedit
          - os: macos-latest
            name: notedit-macos-arm64
            bin: notedit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev xvfb
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          echo '{"restore_session":false}' > "$RUNNER_TEMP/cfg.json"
          NOTEDIT_CONFIG="$RUNNER_TEMP/cfg.json" timeout 60 xvfb-run -a target/release/notedit --smoke-test "$RUNNER_TEMP/smoke.txt" src/workspace.rs
          cat "$RUNNER_TEMP/smoke.txt"; grep -q NOTEDIT_SMOKE_OK "$RUNNER_TEMP/smoke.txt"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo '{"restore_session":false}' > "$RUNNER_TEMP/cfg.json"
          NOTEDIT_CONFIG="$RUNNER_TEMP/cfg.json" target/release/notedit --smoke-test "$RUNNER_TEMP/smoke.txt" src/workspace.rs &
          p=$!; for i in $(seq 60); do kill -0 $p 2>/dev/null || break; sleep 1; done; kill $p 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.txt"; grep -q NOTEDIT_SMOKE_OK "$RUNNER_TEMP/smoke.txt"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '{"restore_session":false}' | Set-Content "$env:RUNNER_TEMP\cfg.json"
          $env:NOTEDIT_CONFIG = "$env:RUNNER_TEMP\cfg.json"
          $p = Start-Process -FilePath target\release\notedit.exe -ArgumentList "--smoke-test","$env:RUNNER_TEMP\smoke.txt","src\workspace.rs" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "smoke test timed out" }
          Get-Content "$env:RUNNER_TEMP\smoke.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke.txt" -Pattern NOTEDIT_SMOKE_OK -Quiet)) { throw "smoke test failed" }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/${{ matrix.bin }}, README.md, LICENSE, ui/fonts/LICENSE-DejaVu.txt, ui/fonts/LICENSE-JetBrainsMono-OFL.txt $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          d=${{ matrix.name }}
          mkdir $d
          cp target/release/${{ matrix.bin }} README.md LICENSE ui/fonts/LICENSE-DejaVu.txt ui/fonts/LICENSE-JetBrainsMono-OFL.txt $d/
          chmod +x $d/${{ matrix.bin }}
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          name: NotEdit ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
