[package]
license = "MIT"
name = "notedit"
version = "0.7.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
arboard = { version = "3", default-features = false }
chardetng = "1.0.0"
encoding_rs = "0.8.35"
ferrous-opencc = "0.4.0"
fontdb = "0.22"
i-slint-backend-winit = "=1.18.1"
memmap2 = "0.9.12"
pulldown-cmark = { version = "0.12", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
ropey = "1.6"
similar = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
slint = { version = "=1.18.1", features = ["raw-window-handle-06"] }
spellbook = "0.4.2"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "html", "yaml-load"] }
unicode-width = "0.2"
winit = { version = "0.30", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Tests/dev builds keep unwinding (required by the test harness).
[profile.dev]
opt-level = 1

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
