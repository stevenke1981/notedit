[package]
license = "MIT"
name = "notedit"
version = "0.2.1"
edition = "2021"

[dependencies]
arboard = { version = "3", default-features = false }
chardetng = "1.0.0"
encoding_rs = "0.8.35"
fontdb = "0.22"
i-slint-backend-winit = "=1.9.2"
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1.13.1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
slint = "=1.9.2"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "html"] }
winit = { version = "0.30", default-features = false }

[build-dependencies]
slint-build = "=1.9.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
