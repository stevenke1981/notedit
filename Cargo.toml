[package]
name = "slint-notepad"
version = "0.1.0"
edition = "2021"

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.35"
pulldown-cmark = { version = "0.12", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
slint = "=1.9.2"

[build-dependencies]
slint-build = "=1.9.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
